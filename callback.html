<title>Solar Engineer — Authorization Complete</title>
<style>
  :root { --bg:#070B14; --surface:#0F1626; --ink:#F5F7FA; --muted:#96A0B4; --accent:#FF9F3D; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card { max-width: 640px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
  textarea {
    width: 100%; min-height: 90px; background: var(--surface); color: var(--ink);
    border: 1px solid #202B40; border-radius: 8px; padding: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    resize: vertical;
  }
  button {
    margin-top: 14px; background: var(--accent); color: #1C1C1C; border: none;
    border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
<div class="card">
  <h1>Authorization complete</h1>
  <p>Copy the full URL below (including the code) and paste it back into the chat.</p>
  <textarea id="out" readonly></textarea>
  <br>
  <button onclick="document.getElementById('out').select(); document.execCommand('copy');">Copy</button>
</div>
<script>
  document.getElementById('out').value = window.location.href;
</script>
